[package]
name = "ms-gkdi"
version = "0.1.0-dev"
edition = "2021"
rust-version = "1.74"
description = "MS-GKDI Group Key Distribution — L0/L1/L2 seed-key tree walk + ISDKey GetKey RPC. Extracted from dpapi-ng. UNVALIDATED CRYPTO — see README, do not publish."
license = "MIT"
repository = "https://github.com/icedracon/ms-gkdi"
readme = "README.md"
keywords = ["ms-gkdi", "gkdi", "kds", "active-directory", "windows"]
categories = ["cryptography", "parser-implementations", "os::windows-apis"]

# Publish gate — this crate is 0.1.0-dev and MUST NOT be pushed to crates.io until
# the KAT harness described in README lands.
[package.metadata.publish_gate]
status = "unvalidated-crypto"

[dependencies]
thiserror = "2"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
aes-kw = "0.2"
dcerpc = { path = "../dcerpc", version = "0.2" }
ms-ndr = { path = "../ms-ndr", version = "0.1" }
